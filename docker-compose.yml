services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      API_BASE_URL: http://localhost:8080
      API_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - bot
    restart: always